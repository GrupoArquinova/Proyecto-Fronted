name: Frontend CI - Arquinova

on:
  push:
  pull_request:

jobs:
  calidad:
    name: Lint, pruebas unitarias, build y auditoría
    runs-on: ubuntu-latest
    steps:
      - name: Código fuente
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (ESLint + reglas de Angular y accesibilidad)
        run: npm run lint

      - name: Pruebas unitarias con cobertura
        run: npm run test:cobertura

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: coverage
          if-no-files-found: ignore

      - name: Build de producción (el mismo que usa Vercel)
        run: npx ng build --configuration vercel

      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Pruebas de extremo a extremo (Playwright)
    runs-on: ubuntu-latest
    needs: calidad
    env:
      PLAYWRIGHT_CANAL: chromium
    steps:
      - name: Código fuente
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar el navegador
        run: npx playwright install --with-deps chromium

      - name: Pruebas e2e del sitio y del panel
        run: npx playwright test

      - name: Pruebas de la política CSP (build de Vercel con sus cabeceras)
        run: npm run e2e:csp

      - name: Subir trazas si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trazas-playwright
          path: test-results
          if-no-files-found: ignore
