@if (visible()) {
  <!-- Píldora junto al botón de WhatsApp: abre o cierra el chat -->
  <button
    type="button"
    class="chat-toggle-btn"
    [class.abierto]="abierto()"
    (click)="toggleChat()"
    [attr.aria-expanded]="abierto()"
    aria-controls="chat-ventana">
    @if (!abierto()) {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
      </svg>
      <span class="etiqueta">{{ 'chat.boton' | transloco }}</span>
    } @else {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <line x1="6" y1="6" x2="18" y2="18" />
        <line x1="18" y1="6" x2="6" y2="18" />
      </svg>
      <span class="etiqueta">{{ 'chat.cerrar' | transloco }}</span>
    }
  </button>

  <!-- Ventana de la conversación -->
  @if (abierto()) {
    <section id="chat-ventana" class="chat-window" role="dialog" [attr.aria-label]="'chat.titulo' | transloco">
      <header class="chat-header">
        <h3>{{ 'chat.titulo' | transloco }}</h3>
        <span class="status-dot" aria-hidden="true"></span>
      </header>

      <div #cuerpo class="chat-body" aria-live="polite">
        <div class="chat-bubble ai-msg">
          <p>{{ 'chat.saludo' | transloco }}</p>
        </div>

        @for (msg of mensajes(); track $index) {
          <div class="chat-bubble" [class.user-msg]="msg.remitente === 'usuario'" [class.ai-msg]="msg.remitente === 'ia'">
            <p>{{ msg.texto }}</p>
          </div>
        }

        @if (cargando()) {
          <div class="chat-bubble ai-msg loading">
            <p><em>{{ 'chat.escribiendo' | transloco }}</em></p>
          </div>
        }
      </div>

      <form class="chat-footer" (ngSubmit)="enviarMensaje()">
        <input
          type="text"
          name="pregunta"
          autocomplete="off"
          [(ngModel)]="preguntaActual"
          [maxlength]="preguntaMax"
          [placeholder]="'chat.placeholder' | transloco"
          [attr.aria-label]="'chat.placeholder' | transloco"
          [disabled]="cargando()" />
        <button type="submit" [disabled]="cargando()">{{ 'chat.enviar' | transloco }}</button>
      </form>
    </section>
  }
}
