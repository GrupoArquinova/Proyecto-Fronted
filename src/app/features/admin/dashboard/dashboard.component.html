<div class="admin-layout">
  <!-- Navbar superior -->
  <header class="navbar">
    <div class="brand">
      <button class="hamburger-btn" (click)="toggleSidebar()">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <img
        src="https://res.cloudinary.com/dn3s7utod/image/upload/v1790258444/logo-Arquinova_dgkosg.jpg"
        alt="Logo Arquinova"
        class="brand-logo"
      />
    </div>

    <!-- Quién tiene la sesión: icono de usuario y su rol, en la esquina derecha -->
    <div class="usuario-admin" [attr.title]="correo ? userName + ' · ' + correo : userName">
      <svg class="usuario-icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="8" r="4"></circle>
        <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"></path>
      </svg>
      <div class="usuario-datos">
        <strong class="usuario-nombre">{{ userName }}</strong>
        <span class="usuario-rol">Admin@if (correo) {<span class="usuario-correo"> · {{ correo }}</span>}</span>
      </div>
    </div>
  </header>
  <!-- Cuerpo principal -->
  <div class="admin-body" [class.sidebar-open]="sidebarOpen">
    @if (sidebarOpen) {
      <div class="sidebar-overlay" role="presentation" (click)="toggleSidebar()"></div>
    }
    <app-sidebar
      class="app-sidebar"
      (logout)="onLogout()"
      (navigated)="sidebarOpen = false"
    ></app-sidebar>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
