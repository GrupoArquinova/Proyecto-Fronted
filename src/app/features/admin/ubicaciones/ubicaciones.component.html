<!-- Botón principal para abrir el modal de creación -->
<div class="header-section" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
  <h2>Ubicaciones</h2>
  <button class="btn-nuevo" (click)="abrirModalCrear()" style="background: #1b4d3e; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 8px; cursor: pointer; font-weight: 500;">
    + Nueva Ubicación
  </button>
</div>

<!-- Grid de tarjetas (la vista principal) -->
<div class="cards-grid">
  <div class="ubicacion-card" *ngFor="let item of listaUbicaciones">
    <div class="card-icon-header">
      <div class="icon-circle">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
      </div>
    </div>

    <div class="card-content">
      <h3>{{ item.proyectoNombre || 'Proyecto Inmobiliario' }}</h3>
      <p class="ubicacion-sub">{{ item.ciudad }}, {{ item.departamento }}</p>
    </div>

    <div class="card-footer" style="display: flex; justify-content: space-between; align-items: center;">
      <button class="btn-ver-ubicacion" (click)="abrirDetalleUbicacion(item)">
        Ver / Editar &rarr;
      </button>
      <button class="btn-eliminar" (click)="eliminarUbicacion(item.id!)" style="background: none; border: none; color: #dc2626; cursor: pointer;">
        Eliminar
      </button>
    </div>
  </div>
</div>

<!-- Modal Formulario para Crear / Editar Ubicación -->
<div class="modal-overlay" *ngIf="mostrarModal" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000;">
  <div class="modal-card" style="background: white; padding: 2rem; border-radius: 12px; width: 90%; max-width: 650px; max-height: 90vh; overflow-y: auto;">
    <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
      <h3 style="margin: 0; font-family: serif;">{{ editandoId ? 'Editar Ubicación' : 'Registrar Ubicación' }}</h3>
      <button (click)="cerrarModal()" style="background: none; border: none; font-size: 1.2rem; cursor: pointer;">&times;</button>
    </div>

    <form (ngSubmit)="guardarUbicacion()" #ubicacionForm="ngForm">
      <div class="form-grid-2">
        
        <!-- Proyecto -->
        <div style="grid-column: span 2;" class="form-group">
          <label style="display:block; font-size:0.85rem; font-weight:500; margin-bottom:0.3rem;">Proyecto *</label>
          <select name="proyectoId" [(ngModel)]="formData.proyectoId" required style="width: 100%; padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 6px;">
            <option [value]="0" disabled>Selecciona un proyecto</option>
            <option *ngFor="let p of proyectosDisponibles" [value]="p.id">{{ p.nombre }}</option>
          </select>
        </div>

        <!-- Ciudad -->
        <div class="form-group">
          <label style="display:block; font-size:0.85rem; font-weight:500; margin-bottom:0.3rem;">Ciudad *</label>
          <input type="text" name="ciudad" [(ngModel)]="formData.ciudad" required placeholder="Ej. Armenia" style="width: 100%; padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;" />
        </div>

        <!-- Departamento -->
        <div class="form-group">
          <label style="display:block; font-size:0.85rem; font-weight:500; margin-bottom:0.3rem;">Departamento *</label>
          <input type="text" name="departamento" [(ngModel)]="formData.departamento" required placeholder="Ej. Quindío" style="width: 100%; padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;" />
        </div>

        <!-- Dirección -->
        <div style="grid-column: span 2;" class="form-group">
          <label style="display:block; font-size:0.85rem; font-weight:500; margin-bottom:0.3rem;">Dirección</label>
          <input type="text" name="direccion" [(ngModel)]="formData.direccion" placeholder="Ej. Km 3 vía al edén" style="width: 100%; padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;" />
        </div>

        <!-- Referencias -->
        <div style="grid-column: span 2;" class="form-group">
          <label style="display:block; font-size:0.85rem; font-weight:500; margin-bottom:0.3rem;">Referencias</label>
          <textarea name="referencias" [(ngModel)]="formData.referencias" rows="2" placeholder="Puntos de referencia cercanos..." style="width: 100%; padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;"></textarea>
        </div>

        <!-- Latitud -->
        <div class="form-group">
          <label style="display:block; font-size:0.85rem; font-weight:500; margin-bottom:0.3rem;">Latitud</label>
          <input type="number" step="any" name="latitud" [(ngModel)]="formData.latitud" placeholder="4.533888" style="width: 100%; padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;" />
        </div>

        <!-- Longitud -->
        <div class="form-group">
          <label style="display:block; font-size:0.85rem; font-weight:500; margin-bottom:0.3rem;">Longitud</label>
          <input type="number" step="any" name="longitud" [(ngModel)]="formData.longitud" placeholder="-75.681111" style="width: 100%; padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;" />
        </div>

        <!-- URLs Multimedia que pide tu tabla -->
        <div style="grid-column: span 2;" class="form-group">
          <label style="display:block; font-size:0.85rem; font-weight:500; margin-bottom:0.3rem;">Google Maps URL</label>
          <input type="text" name="googleMapsUrl" [(ngModel)]="formData.googleMapsUrl" placeholder="https://goo.gl/maps/..." style="width: 100%; padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;" />
        </div>

        <div class="form-group">
          <label style="display:block; font-size:0.85rem; font-weight:500; margin-bottom:0.3rem;">Urbanismo URL</label>
          <input type="text" name="urbanismoUrl" [(ngModel)]="formData.urbanismoUrl" style="width: 100%; padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;" />
        </div>

        <div class="form-group">
          <label style="display:block; font-size:0.85rem; font-weight:500; margin-bottom:0.3rem;">Vista Aérea URL</label>
          <input type="text" name="vistaAereaUrl" [(ngModel)]="formData.vistaAereaUrl" style="width: 100%; padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;" />
        </div>

        <div class="form-group">
          <label style="display:block; font-size:0.85rem; font-weight:500; margin-bottom:0.3rem;">Recorrido 360 URL</label>
          <input type="text" name="recorrido360Url" [(ngModel)]="formData.recorrido360Url" style="width: 100%; padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;" />
        </div>

        <div class="form-group">
          <label style="display:block; font-size:0.85rem; font-weight:500; margin-bottom:0.3rem;">Video Cómo Llegar URL</label>
          <input type="text" name="videoComoLlegarUrl" [(ngModel)]="formData.videoComoLlegarUrl" style="width: 100%; padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;" />
        </div>

      </div>

      <div style="display: flex; justify-content: flex-end; gap: 0.8rem; margin-top: 1.5rem;">
        <button type="button" (click)="cerrarModal()" style="padding: 0.5rem 1rem; background: #e2e8f0; border: none; border-radius: 6px; cursor: pointer;">Cancelar</button>
        <button type="submit" [disabled]="!ubicacionForm.form.valid || guardando" style="padding: 0.5rem 1.2rem; background: #1b4d3e; color: white; border: none; border-radius: 6px; cursor: pointer;">
          {{ guardando ? 'Guardando...' : 'Guardar' }}
        </button>
      </div>
    </form>
  </div>
</div>
