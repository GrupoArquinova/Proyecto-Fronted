<div class="recovery-wrapper">
  <h1 class="brand-title">Arquinova</h1>

  <div class="recovery-card">
    <h2>Restablecer Contraseña</h2>
    <p class="subtitle">Ingresa el token recibido en tu correo y tu nueva contraseña.</p>

    <form (ngSubmit)="onSubmit()" *ngIf="!successMessage">
      <div class="form-group">
        <label for="token">Token de recuperación</label>
        <input
          type="text"
          id="token"
          name="token"
          [(ngModel)]="token"
          placeholder="Ej. abc123xyz"
          required
        />
      </div>

      <div class="form-group">
        <label for="nuevaPassword">Nueva contraseña</label>
        <input
          type="password"
          id="nuevaPassword"
          name="nuevaPassword"
          [(ngModel)]="nuevaPassword"
          placeholder="••••••••"
          required
        />
      </div>

      <div *ngIf="errorMessage" class="error-msg">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-submit" [disabled]="isLoading">
        {{ isLoading ? 'Guardando...' : 'Cambiar Contraseña' }}
      </button>
    </form>

    <div *ngIf="successMessage" class="success-box">
      <p>{{ successMessage }}</p>
      <small>Redirigiendo al inicio de sesión...</small>
    </div>

    <div class="card-footer">
      <a routerLink="/login" class="back-link">&larr; Cancelar</a>
    </div>
  </div>
</div>
