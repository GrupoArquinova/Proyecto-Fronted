<div class="recovery-wrapper">
  <h1 class="brand-title">Arquinova</h1>

  <div class="recovery-card">
    <h2>Recuperar Contraseña</h2>
    <p class="subtitle">Ingresa tu correo para recibir un token de recuperación.</p>

    <form (ngSubmit)="onSubmit()" *ngIf="!successMessage">
      <div class="form-group">
        <label for="correo">Correo electrónico</label>
        <input
          type="email"
          id="correo"
          name="correo"
          [(ngModel)]="correo"
          placeholder="admin@arquinova.com"
          required
        />
      </div>

      <div *ngIf="errorMessage" class="error-msg">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-submit" [disabled]="isLoading">
        {{ isLoading ? 'Enviando...' : 'Solicitar Token' }}
      </button>
    </form>

    <div *ngIf="successMessage" class="success-box">
      <p>{{ successMessage }}</p>
      <button (click)="irARestablecer()" class="btn-submit">Ingresar Token de Restablecimiento</button>
    </div>

    <div class="card-footer">
      <a routerLink="/login" class="back-link">&larr; Volver al inicio de sesión</a>
    </div>
  </div>
</div>
