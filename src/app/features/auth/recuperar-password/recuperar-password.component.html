<div class="recovery-wrapper">
  <!-- Botón flotante superior -->
  <a routerLink="/login" class="btn-back-top">
    &larr; Volver al inicio de sesión
  </a>

  <div class="recovery-card">
    <div class="card-header">
      <h1 class="brand-title">Arquinova</h1>
      <span class="panel-subtitle">PANEL ADMINISTRATIVO</span>
    </div>

    <h2>Recuperar Contraseña</h2>
    <p class="subtitle">Ingresa tu correo para recibir un token de recuperación.</p>

    <form (ngSubmit)="onSubmit()" *ngIf="!successMessage">
      <div class="form-group">
        <label for="correo">Correo electrónico</label>
        <input
          type="email"
          id="correo"
          name="correo"
          [(ngModel)]="correo"
          placeholder="admin@arquinova.com"
          required
        />
      </div>

      <div *ngIf="errorMessage" class="error-msg">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-submit" [disabled]="isLoading">
        {{ isLoading ? 'Enviando...' : 'Solicitar Token' }}
      </button>
    </form>

    <div *ngIf="successMessage" class="success-box">
      <p>{{ successMessage }}</p>
      <button (click)="irARestablecer()" class="btn-submit">
        Ingresar Token de Restablecimiento
      </button>
    </div>

    <div class="card-footer">
      <a routerLink="/login" class="back-link">&larr; Volver al inicio de sesión</a>
    </div>
  </div>
</div>
