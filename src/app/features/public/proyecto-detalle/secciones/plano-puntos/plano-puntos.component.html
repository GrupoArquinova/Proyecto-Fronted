<div class="fondo" [style.backgroundImage]="'url(' + url() + ')'" aria-hidden="true"></div>

<div class="area">
  <!-- La caja mide exactamente lo que la imagen: así los porcentajes de los botones caen en su sitio -->
  <div class="caja" (click)="clic($event)">
    <img [src]="url()" [alt]="titulo()" draggable="false" />

    @for (punto of puntos(); track punto.id) {
      @if (punto.posX != null && punto.posY != null) {
        <button type="button" class="pin" [style.left.%]="punto.posX" [style.top.%]="punto.posY"
                (click)="elegir(punto, $event)" [attr.aria-label]="punto.etiqueta">
          <span class="etiqueta">{{ punto.etiqueta }}</span>
          <span class="icono" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                 stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
              <circle cx="12" cy="13" r="4" />
            </svg>
          </span>
        </button>
      }
    }

    @if (pendiente(); as marca) {
      <span class="pendiente" [style.left.%]="marca.x" [style.top.%]="marca.y"></span>
    }
  </div>
</div>
