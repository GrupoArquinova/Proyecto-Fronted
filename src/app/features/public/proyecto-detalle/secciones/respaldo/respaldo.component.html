@if (proyecto(); as p) {
  <section class="seccion">
    <header>
      <span class="etiqueta">Quiénes somos</span>
      <h2>Respaldo</h2>
    </header>

    @for (texto of textos(); track texto.id) {
      <article>
        <h3>{{ texto.titulo }}</h3>
        <p>{{ texto.contenido }}</p>
      </article>
    }
  </section>
}
